name: grpo
profile: cuda-blackwell
method: grpo
model_path: CHANGE-ME/relative-to-model-root
datasets: []
command: ["python", "-m", "forge.train.grpo", "--recipe", "{recipe_path}", "--run-dir", "{run_dir}"]
params:
  dataset_path: null
  num_generations: 8
  learning_rate: 1.0e-6
  max_seq_length: 2048
  per_device_batch: 2
  grad_accum: 8
  save_steps: 250
  # GRPO requires a reward module: a Python path under the repo root, resolving
  # to a reward function trl.GRPOTrainer accepts as reward_funcs. rewards.length_penalty
  # (rewards/length_penalty.py) is a minimal working example — set
  # reward_module: rewards.length_penalty to use it as-is, or write your own.
  reward_module: null
grace_sec: 600
push_to_hf: false
