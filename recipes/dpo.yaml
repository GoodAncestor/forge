name: dpo
profile: cuda-blackwell
method: dpo
model_path: CHANGE-ME/relative-to-model-root
datasets: []
command: ["python", "-m", "forge.train.dpo", "--recipe", "{recipe_path}", "--run-dir", "{run_dir}"]
params:
  dataset_path: null
  beta: 0.1
  learning_rate: 5.0e-6
  max_seq_length: 2048
  per_device_batch: 2
  grad_accum: 8
  save_steps: 250
grace_sec: 600
push_to_hf: false
