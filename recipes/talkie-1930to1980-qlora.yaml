# THE v1 ACCEPTANCE DEMO. Extends talkie-1930-13b-base's knowledge 1930->1980
# via QLoRA continued pretraining. Model is NAS-resident (downloaded 2026-04-29):
# verify with: ls $FORGE_MODEL_ROOT/talkie-lm/talkie-1930-13b-base
# Corpus: 1930-1980 slice built from the chronicling-america + gutenberg +
# wikipedia manifest entries, cleaned per the historical-model-training rules
# (GoodAncestor HQ knowledge/projects/historical-model-training.md).
name: talkie-1930to1980-qlora
profile: cuda-blackwell
method: cpt-qlora
model_path: talkie-lm/talkie-1930-13b-base
datasets: [chronicling-america-1930-1963, gutenberg-mirror, wikipedia-en-dump]
command: ["python", "-m", "forge.train.cpt", "--recipe", "{recipe_path}", "--run-dir", "{run_dir}"]
params:
  dataset_path: "{data_root}/corpus-1930-1980/train.jsonl"
  lora_r: 32
  lora_alpha: 64
  learning_rate: 2.0e-4
  max_seq_length: 2048
  per_device_batch: 2          # 13B 4-bit on 32GB: batch 2 + accum 16
  grad_accum: 16
  save_steps: 250
  max_steps: -1
grace_sec: 900
push_to_hf: false
