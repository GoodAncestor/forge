[project]
name = "forge"
version = "0.1.0"
description = "Good Ancestor model lab: envs, datasets, lease-safe runs"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pyyaml>=6.0", "huggingface_hub>=0.30"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
